    *,
    *::before,

    :root {

      --ink:     #0f0e0c;

      --ink-b:   rgba(15,14,12,0.15);

      --muted2:  #b0ada5;

      --glow:     rgba(15,14,12,0.07);

    [data-theme="dark"] {
      --bg:      #111110;
      --bg2:     #191817;
      --bg3:     #222120;
      --ink:     #f2f0eb;
      --ink-a:   rgba(242,240,235,0.07);
      --ink-b:   rgba(242,240,235,0.15);
      --white:   #ede9e4;
      --muted:   #7a7870;
      --muted2:  #4a4845;
      --border:  rgba(255,255,255,0.1);
      --green:   #22c55e;

      --dot-clr:  rgba(255,255,255,0.04);
      --glow:     rgba(242,240,235,0.05);
      --shadow-sm:rgba(0,0,0,0.5);
      --shadow-lg:rgba(0,0,0,0.7);
      --on-ink:   #111110;
      --logo-dev: #5a5854;

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--white);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--muted2);
      border-radius: 3px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1 {
      font-family: 'Onest', sans-serif;
    }

    h2,
    h3 {
      font-family: 'Nunito', sans-serif;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes marquee {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4)
      }

      60% {
        box-shadow: 0 0 0 7px rgba(34, 197, 94, 0)
      }
    }

    @keyframes gridFade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .hero-ready .hu {
      animation: fadeUp 0.65s cubic-bezier(0.2, 0, 0, 1) both;
    }

    .cursor {
      display: inline-block;
      width: 2.5px;
      height: 0.82em;
      background: var(--ink);
      vertical-align: middle;
      animation: blink 1s step-end infinite;
      margin-left: 3px;
    }
  </style>

    /* ─── HELPERS ─── */
    function SectionLabel({ text }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 44 }}>
          <div style={{ width: 20, height: 1, background: 'var(--muted2)' }}></div>
          <span style={{ fontSize: 11, letterSpacing: '2px', color: 'var(--muted)', textTransform: 'uppercase' }}>{text}</span>
        </div>
      );
    }

    function Reveal({ children, delay = 0 }) {
      const ref = useRef(null);
      const [vis, setVis] = useState(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVis(true); }, { threshold: 0.1 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);
      return (
        <div ref={ref} style={{ opacity: vis ? 1 : 0, transform: vis ? 'translateY(0)' : 'translateY(18px)', transition: `opacity 0.6s ease ${delay}ms, transform 0.6s ease ${delay}ms` }}>
          {children}
        </div>
      );
    }

    function Typer({ text, speed = 55 }) {
      const [out, setOut] = useState('');
      useEffect(() => {
        setOut(''); let i = 0;
        const id = setInterval(() => { i++; setOut(text.slice(0, i)); if (i >= text.length) clearInterval(id); }, speed);
        return () => clearInterval(id);
      }, [text]);
      return <>{out}<span className="cursor" /></>;
    }

    function Marquee({ items }) {
      const doubled = [...items, ...items];
      return (
        <div style={{ overflow: 'hidden', borderTop: '1px solid var(--border)', borderBottom: '1px solid rgba(0,0,0,0.09)', padding: '13px 0', background: 'var(--bg2)' }}>
          <div style={{ display: 'flex', gap: 48, width: 'max-content', animation: 'marquee 28s linear infinite' }}>

              <span key={i} style={{ display: 'flex', alignItems: 'center', gap: 14, whiteSpace: 'nowrap', fontFamily: 'DM Mono', fontSize: 12, color: 'var(--muted)', letterSpacing: '0.5px' }}>
                <span style={{ color: 'var(--ink)', opacity: 0.4, fontSize: 8 }}>◆</span>
                {item}
              </span>
            ))}
          </div>
        </div>
      );
    }

                        </span>
                      </div>
                      <p style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.65, marginBottom: item.url ? 8 : 0 }}>{item.desc}</p>
                      {item.url && (
                        <a href={`https://${item.url}`} target="_blank" rel="noopener noreferrer" style={{ fontFamily: 'DM Mono', fontSize: 11, color: 'var(--muted2)', textDecoration: 'none', transition: 'color 0.2s' }}
                          onMouseEnter={e => e.target.style.color = 'var(--ink)'}
                          onMouseLeave={e => e.target.style.color = 'var(--muted2)'}>
                          {item.url} ↗
                        </a>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── CONTACT CARD ─── */
    function ContactCard({ icon, label, value, href, accent }) {
      const [hov, setHov] = useState(false);
      return (
        <a href={href} target="_blank" rel="noopener noreferrer"
          onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{ display: 'flex', alignItems: 'center', gap: 18, padding: '20px 24px', borderRadius: 16, border: `1px solid ${hov ? 'rgba(15,14,12,0.3)' : 'var(--border)'}`, background: hov ? 'var(--ink-a)' : 'var(--bg2)', transition: 'all 0.2s ease', transform: hov ? 'translateX(5px)' : 'translateX(0)' }}>
          <span style={{ fontSize: 20, opacity: 0.65 }}>{icon}</span>
          <div>
            <div style={{ fontFamily: 'DM Mono', fontSize: 11, color: 'var(--muted)', letterSpacing: '1px', textTransform: 'uppercase', marginBottom: 4 }}>{label}</div>
            <div style={{ fontFamily: 'DM Mono', fontSize: 14, fontWeight: 500, color: hov ? 'var(--ink)' : 'var(--white)', transition: 'color 0.2s' }}>{value}</div>
          </div>
          <span style={{ marginLeft: 'auto', color: 'var(--muted2)', fontSize: 18, transition: 'transform 0.2s', transform: hov ? 'translateX(4px)' : 'translateX(0)' }}>→</span>
        </a>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
